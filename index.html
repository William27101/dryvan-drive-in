<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DryVan Drive-In · Door 7 Drama</title><link rel="icon" href="icon.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#07070b;color:#eee;font-family:system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#111;border-bottom:2px solid #f59e0b55}
header img{width:34px;height:34px;border-radius:8px}header b{color:#fbbf24;letter-spacing:1px}
#back{margin-left:auto;background:#222;color:#fbbf24;border:1px solid #f59e0b;border-radius:6px;padding:6px 12px;font-size:15px;display:none}
.v{display:none}.v.on{display:block}
/* exterior */
#ext{padding:16px;text-align:center}
.wall{position:relative;margin:10px auto;max-width:380px;height:440px;background:repeating-linear-gradient(90deg,#2a2a30 0 38px,#24242a 38px 40px);border-radius:4px;overflow:hidden;box-shadow:0 0 60px #000 inset}
.light{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:26px;height:14px;background:#ffb347;border-radius:4px;box-shadow:0 0 30px 18px #ff9a2e88,0 80px 160px 60px #ff8c1a33}
.num{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:#fbbf24;color:#111;font-weight:900;font-size:30px;padding:2px 14px;border-radius:4px}
.trailer{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:260px;height:300px;background:#e8e8e8;border:6px solid #9ca3af;display:flex;perspective:600px;cursor:pointer}
.door{flex:1;background:linear-gradient(#f5f5f5,#cfcfcf);border:2px solid #888;transition:transform 1s;position:relative}
.door:before{content:"";position:absolute;left:45%;top:10%;bottom:10%;width:6px;background:#777;border-radius:3px}
.dl{transform-origin:left}.dr{transform-origin:right}
.open .dl{transform:rotateY(-100deg)}.open .dr{transform:rotateY(100deg)}
.lbl{position:absolute;top:-34px;left:0;right:0;color:#fbbf24;font-weight:700;letter-spacing:3px}
.trailer .in{position:absolute;inset:0;background:#1a1208;z-index:-1}
.hint{color:#aaa;margin-top:8px}.red{display:inline-block;width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}
/* pallets */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;background:linear-gradient(#1a1208,#0d0905)}
.pal{background:#3b2a16;border-bottom:10px solid #6b4a24;border-radius:4px;padding:14px 8px;text-align:center;cursor:pointer;box-shadow:0 4px 12px #000}
.pal .box{background:#b08550;color:#2a1a08;border-radius:3px;padding:12px 4px;font-weight:800;font-size:20px}
.pal small{display:block;color:#fbbf24;margin-top:8px;font-size:14px}
h2{margin:14px;color:#fbbf24;font-size:18px}
/* list */
.item{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid #222;cursor:pointer}
.item img{width:72px;height:72px;object-fit:cover;background:#222;border-radius:4px}
.item div{flex:1}.item b{display:block}.item span{color:#999;font-size:13px}
.more{display:block;margin:14px auto;background:#f59e0b;color:#111;border:0;border-radius:6px;padding:10px 20px;font-weight:700;font-size:15px}
video{width:100%;background:#000;max-height:60vh}#det{padding:0 0 30px}#det p{padding:0 14px;color:#ccc;font-size:14px}
</style></head><body>
<header><img src="icon.png" alt=""><b>DOOR 7 · DRAMA</b><button id="back" onclick="back()">◀ Back</button></header>
<section id="ext" class="v on"><div class="wall"><div class="light"></div><div class="num">7</div>
<div class="trailer" id="tr" onclick="openT()"><div class="lbl">DRAMA</div><div class="in"></div><div class="door dl"></div><div class="door dr"></div></div></div>
<div class="hint"><span class="red"></span> Dropped trailer · On demand · <span id="tot">…</span> films<br>Tap the trailer doors to walk in</div></section>
<section id="pals" class="v"><h2>Pallets by decade</h2><div class="grid" id="grid"></div></section>
<section id="list" class="v"><h2 id="lt"></h2><div id="items"></div><button class="more" id="more" onclick="load()">Load more</button></section>
<section id="det" class="v"><video id="vid" controls playsinline preload="metadata"></video><h2 id="dt"></h2><p id="dm"></p><p id="dd"></p></section>
<script>
const B='collection:feature_films AND subject:"Drama"';
const P=[["1920s","year:[1920 TO 1929]"],["1930s","year:[1930 TO 1939]"],["1940s","year:[1940 TO 1949]"],["1950s","year:[1950 TO 1959]"],["1960s","year:[1960 TO 1969]"],["1970s","year:[1970 TO 1979]"],["1980s","year:[1980 TO 1989]"],["Unmarked freight","NOT year:[1920 TO 1989]"]];
const S=u=>fetch("https://archive.org/advancedsearch.php?output=json&"+u).then(r=>r.json());
const q=x=>encodeURIComponent(B+" AND "+x);let stack=["ext"],cur,page;
function show(v){document.querySelectorAll('.v').forEach(e=>e.classList.toggle('on',e.id==v));document.getElementById('back').style.display=v=='ext'?'none':'block';scrollTo(0,0)}
function go(v){stack.push(v);show(v)}
function back(){if(stack.at(-1)=='det'){vid.pause();vid.removeAttribute('src');vid.load()}stack.pop();const v=stack.at(-1);if(v=='ext')tr.classList.remove('open');show(v)}
S("q="+encodeURIComponent(B)+"&rows=0").then(j=>tot.textContent=j.response.numFound.toLocaleString());
grid.innerHTML=P.map((p,i)=>`<div class="pal" onclick="pick(${i})"><div class="box">${p[0]}</div><small id="c${i}">counting…</small></div>`).join('');
P.forEach((p,i)=>S("q="+q(p[1])+"&rows=0").then(j=>document.getElementById('c'+i).textContent=j.response.numFound.toLocaleString()+" films").catch(()=>document.getElementById('c'+i).textContent="count unavailable"));
function openT(){tr.classList.add('open');setTimeout(()=>go('pals'),1000)}
function pick(i){cur=i;page=1;items.innerHTML='';lt.textContent=P[i][0]+" pallet";go('list');load()}
function load(){more.textContent="Loading…";S("q="+q(P[cur][1])+"&fl[]=identifier&fl[]=title&fl[]=year&sort[]=downloads+desc&rows=30&page="+page).then(j=>{
 items.insertAdjacentHTML('beforeend',j.response.docs.map(d=>`<div class="item" onclick="det('${d.identifier}')"><img loading="lazy" src="https://archive.org/services/img/${d.identifier}"><div><b>${(d.title+'').replace(/</g,'&lt;')}</b><span>${d.year||'no year'}</span></div></div>`).join(''));
 more.style.display=page*30<j.response.numFound?'block':'none';more.textContent="Load more";page++}).catch(()=>more.textContent="Retry")}
function det(id){go('det');dt.textContent="Loading…";dm.textContent=dd.textContent="";vid.removeAttribute('src');
 fetch("https://archive.org/metadata/"+id).then(r=>r.json()).then(m=>{const md=m.metadata||{};dt.textContent=md.title||id;dm.textContent=[md.year||md.date,md.runtime].filter(Boolean).join(" · ");
 const t=document.createElement('div');t.innerHTML=[].concat(md.description||'').join(' ');dd.textContent=t.textContent.slice(0,600);
 const f=(m.files||[]).filter(f=>/\.mp4$/i.test(f.name)).sort((a,b)=>(/512kb|h\.264/i.test(b.name)?1:0)-(/512kb|h\.264/i.test(a.name)?1:0))[0];
 if(f){vid.src=`https://archive.org/download/${id}/${encodeURIComponent(f.name)}`;vid.poster="https://archive.org/services/img/"+id}else dd.textContent="No in-app playable MP4 for this title. "+dd.textContent})}
</script></body></html>
