<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DryVan Drive-In · Door 7 Drama</title><link rel="icon" href="icon.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#07070b;color:#eee;font-family:system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#111;border-bottom:2px solid #f59e0b55}
header img{width:34px;height:34px;border-radius:8px}header b{color:#fbbf24;letter-spacing:1px}
#back{margin-left:auto;background:#222;color:#fbbf24;border:1px solid #f59e0b;border-radius:6px;padding:6px 12px;font-size:15px;display:none}
.v{display:none}.v.on{display:block}
/* exterior */
#ext{padding:16px;text-align:center}
.wall{position:relative;margin:10px auto;max-width:380px;height:440px;background:repeating-linear-gradient(90deg,#2a2a30 0 38px,#24242a 38px 40px);border-radius:4px;overflow:hidden;box-shadow:0 0 60px #000 inset}
.light{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:26px;height:14px;background:#ffb347;border-radius:4px;box-shadow:0 0 30px 18px #ff9a2e88,0 80px 160px 60px #ff8c1a33}
.num{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:#fbbf24;color:#111;font-weight:900;font-size:30px;padding:2px 14px;border-radius:4px}
.dock{position:absolute;top:80px;left:50%;transform:translateX(-50%);width:230px;height:250px;background:#1a1208;overflow:hidden;border:6px solid #444}
.dock .glow{position:absolute;inset:0;background:radial-gradient(#ffb34755,#1a1208 70%)}
.roll{position:absolute;inset:0;background:repeating-linear-gradient(#8a8f98 0 16px,#6b7079 16px 19px);transition:transform 1.2s ease-in}
.open .roll{transform:translateY(-100%)}
.trailer{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:230px;height:300px;cursor:pointer;transition:transform 1s ease-in,opacity 1s}
.open .trailer{transform:translateX(-50%) translateY(130%) scale(1.3);opacity:0}
.front{position:absolute;top:0;left:0;right:0;height:240px;background:linear-gradient(#f4f4f4,#d4d4d4);border:4px solid #9ca3af;border-radius:6px 6px 2px 2px}
.front:before{content:"";position:absolute;inset:14px;border:2px dashed #bbb}
.lbl{position:absolute;top:70px;left:0;right:0;color:#333;font-weight:900;letter-spacing:4px;font-size:22px}
.gh{position:absolute;bottom:22px;width:22px;height:14px;border-radius:7px}.gh.r{left:90px;background:#dc2626}.gh.b{left:138px;background:#2563eb}
.plug{position:absolute;bottom:20px;left:116px;width:18px;height:18px;border-radius:50%;background:#222;border:3px solid #777}
.plate{position:absolute;top:240px;left:20px;right:20px;height:12px;background:#555}
.pin{position:absolute;top:252px;left:117px;width:16px;height:14px;background:#333;border-radius:0 0 4px 4px}
.leg{position:absolute;top:252px;width:12px;height:44px;background:#4b5563}.leg.l{left:36px}.leg.rr{right:36px}
.leg:after{content:"";position:absolute;bottom:-4px;left:-8px;width:28px;height:6px;background:#374151}
.crank{position:absolute;top:262px;right:16px;width:22px;height:4px;background:#6b7280}
.wall:after{content:"";position:absolute;bottom:0;left:0;right:0;height:16px;background:#111}
.hint{color:#aaa;margin-top:8px}.red{display:inline-block;width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}
/* pallets */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;background:linear-gradient(#1a1208,#0d0905)}
.pal{background:#3b2a16;border-bottom:10px solid #6b4a24;border-radius:4px;padding:14px 8px;text-align:center;cursor:pointer;box-shadow:0 4px 12px #000}
.pal .box{background:#b08550;color:#2a1a08;border-radius:3px;padding:12px 4px;font-weight:800;font-size:20px}
.pal small{display:block;color:#fbbf24;margin-top:8px;font-size:14px}
h2{margin:14px;color:#fbbf24;font-size:18px}
/* list */
.item{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid #222;cursor:pointer}
.item img{width:72px;height:72px;object-fit:cover;background:#222;border-radius:4px}
.item div{flex:1}.item b{display:block}.item span{color:#999;font-size:13px}
.more{display:block;margin:14px auto;background:#f59e0b;color:#111;border:0;border-radius:6px;padding:10px 20px;font-weight:700;font-size:15px}
video{width:100%;background:#000;max-height:60vh}#det{padding:0 0 30px}#det p{padding:0 14px;color:#ccc;font-size:14px}
#menu{overflow-x:auto;white-space:nowrap;padding:16px 8px;scroll-snap-type:x mandatory}
.bay{display:inline-block;vertical-align:bottom;width:270px;margin:0 6px;scroll-snap-align:center;white-space:normal}
.bay .wall{height:420px;margin:0}
.wall.live .light{background:#4ade80;box-shadow:0 0 30px 18px #22c55e88}.wall.end .light{background:#ef4444;box-shadow:0 0 30px 18px #dc262688}
.wall.live .roll{transform:translateY(-100%)}.wall.live .dock{cursor:pointer;height:300px}
.wall.live .dock .glow{background:radial-gradient(#fde68a66,#1a1208 70%)}
.wall.live .dock b{position:absolute;top:110px;left:0;right:0;text-align:center;color:#fde68a;font-size:20px}
.cap{text-align:center;color:#ccc;font-size:14px;margin-top:6px}
.stairs{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:200px;cursor:pointer}
.wd{margin:0 auto;width:80px;height:130px;background:#6b7079;border:4px solid #444;position:relative}.wd:after{content:"";position:absolute;right:8px;top:60px;width:10px;height:6px;background:#ddd}
.wdl{background:#fbbf24;color:#111;font-weight:900;font-size:12px;text-align:center;padding:2px;margin:0 auto 4px;width:110px}
.st{height:16px;background:repeating-linear-gradient(90deg,#9ca3af 0 4px,#6b7280 4px 8px);border-top:2px solid #d1d5db;margin:0 auto}
#srch{padding:14px}#srch input{width:100%;padding:12px;font-size:16px;border-radius:6px;border:1px solid #f59e0b;background:#111;color:#fff}
.ph{position:relative;height:440px;background-size:cover;background-position:center;border-radius:4px;cursor:pointer;overflow:hidden;box-shadow:0 6px 20px #000}
.ph .num{top:12px;font-size:26px}.plbl{position:absolute;bottom:18px;left:10px;right:10px;text-align:center;background:#000a;color:#fbbf24;font-weight:900;letter-spacing:2px;padding:6px;border-radius:4px;font-size:15px}
.ph .fade{position:absolute;inset:0;background:#fde68a;opacity:0;transition:opacity 1.1s}.ph{transition:transform 1.1s ease-in}
.ph.open{transform:scale(1.6)}.ph.open .fade{opacity:.85}
#menu{scroll-snap-type:none!important;padding:0!important;display:flex;white-space:normal;-webkit-overflow-scrolling:touch;
background:linear-gradient(#050507 0 10px,#3a2a1a 10px 14px,transparent 14px),
 linear-gradient(transparent 0 205px,#2a2018 205px 212px,transparent 212px),
 repeating-linear-gradient(90deg,#6b5236 0 14px,#5a4430 14px 18px) 0 0/100% 205px no-repeat,
 linear-gradient(#4a3a2a 0 470px,#2b2118 470px 480px,#1c1610 480px);min-height:520px}
#menu .bay{flex:0 0 270px;margin:0 -24px;width:auto;position:relative;scroll-snap-align:none}
#menu .bay:first-child{margin-left:0}#menu .bay:last-child{margin-right:0}
#menu .ph{border-radius:0;box-shadow:none;height:480px;
-webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
#menu .ph .num{top:112px;background:none;color:#f5f5f0;font:900 34px/1 Impact,'Arial Black',sans-serif;text-shadow:0 0 2px #000,0 0 10px #000a;opacity:.92;padding:0}
#menu .cap{position:absolute;bottom:-34px;left:0;right:0;z-index:2}
#menu .plbl{bottom:24px;left:44px;right:44px}
.cap{color:#ddd}
#ext{padding:0!important}</style></head><body>
<header><img src="icon.png" alt=""><b id="hd">DRYVAN DRIVE-IN</b><button id="back" onclick="back()">◀ Back</button></header>
<section id="ext" class="v on"><div id="menu"></div><div class="cap" style="padding:44px 0 10px">◀ drag along the dock ▶</div></section>
<section id="livev" class="v"><h2 id="lvt"></h2><p style="padding:0 14px;color:#ccc">Live feed coming soon. This open door will carry live channels.</p></section>
<section id="srch" class="v"><h2>Driver Check · Search</h2><input id="sq" placeholder="Search movie & TV titles" onkeydown="if(event.key=='Enter')doS()"></section>
<section id="pals" class="v"><h2>Pallets by decade</h2><div class="grid" id="grid"></div></section>
<section id="list" class="v"><h2 id="lt"></h2><div id="items"></div><button class="more" id="more" onclick="load()">Load more</button></section>
<section id="det" class="v"><video id="vid" controls playsinline preload="metadata"></video><button class="more" id="dlb" onclick="dl()">⬇ Download</button><h2 id="dt"></h2><p id="dm"></p><p id="dd"></p></section>
<script>
const FF='collection:feature_films AND ';
const D=[["Live News","live"],["Music Videos","live"],["Faith","live"],["Outdoors & Motors","live"],["Local & Government","live"],["Shopping","live"],
["Drama",FF+'subject:"Drama"'],["Comedy",FF+'subject:"Comedy"'],["Noir & Mystery",FF+'(subject:"Film Noir" OR subject:"Mystery")'],["Westerns",FF+'subject:"Western"'],["Horror & Sci-Fi",FF+'(subject:"Horror" OR subject:"Sci-Fi" OR subject:"Science Fiction")'],["Classic TV",'collection:classic_tv'],["End of row","end"]];
let B=D[6][1],ti=null;
const IMG={walk:'img/walk.webp',live:'img/open.webp',tr:'img/trailer.webp',box:'img/container.webp',end:'img/end.webp'};
D.splice(12,0,["Continue Watching","cw"],["My Loads","ml"]);
function bay(img,n,lbl,cap,click,id){return `<div class="bay"><div class="ph" id="${id||''}" style="background-image:url(${img})" onclick="${click}">${n?`<div class="num">${n}</div>`:''}${lbl?`<div class="plbl">${lbl}</div>`:''}<div class="fade"></div></div><div class="cap">${cap}</div></div>`}
menu.innerHTML=bay(IMG.walk,'','DRIVER CHECK','Search',"hd.textContent='DRIVER CHECK';go('srch')")+D.map((d,i)=>{const n=i+1,k=d[1];
 if(k=='live')return bay(IMG.live,n,d[0].toUpperCase(),d[0]+' · <span style="color:#4ade80">● live</span>',`lv(${i})`);
 if(k=='end')return bay(IMG.end,n,'','End of row · closed','');
 if(k=='cw'||k=='ml')return bay(IMG.box,n,d[0].toUpperCase(),d[0],`saved('${k}',${i})`);
 return bay(IMG.tr,n,d[0].toUpperCase(),d[0]+' · <span id="t'+i+'">…</span> titles',`openT(${i})`,'w'+i)}).join('');
D.forEach((d,i)=>{if(i>5&&i<12)fetch("https://archive.org/advancedsearch.php?output=json&rows=0&q="+encodeURIComponent(d[1])).then(r=>r.json()).then(j=>document.getElementById('t'+i).textContent=j.response.numFound.toLocaleString())});
const LS=k=>JSON.parse(localStorage.getItem(k)||'{}'),SV=(k,o)=>localStorage.setItem(k,JSON.stringify(o));
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
function saved(k,i){hd.textContent='DOOR '+(i+1)+' · '+D[i][0].toUpperCase();lt.textContent=D[i][0];more.style.display='none';
 const o=LS(k),a=Object.entries(o).sort((x,y)=>y[1].at-x[1].at);
 items.innerHTML=a.length?a.map(([id,v])=>`<div class="item" onclick="det('${id}')"><img loading="lazy" src="https://archive.org/services/img/${id}"><div><b>${v.title.replace(/</g,'&lt;')}</b><span>${k=='cw'?'Stopped at '+fmt(v.t)+' · tap to resume':'<a href="'+v.url+'" download target="_blank" style="color:#fbbf24" onclick="event.stopPropagation()">Download file</a>'}</span></div></div>`).join(''):'<p style="padding:14px;color:#aaa">'+(k=='cw'?'Nothing in progress yet. Start a title and it will show up here.':'No loads yet. Tap Download in the player to add one.')+'</p>';
 go('list')}
let curId,curT,lastS=0;
vid.addEventListener('timeupdate',()=>{if(!curId||vid.currentTime<5||Date.now()-lastS<3000)return;lastS=Date.now();const o=LS('cw');o[curId]={title:curT,t:vid.currentTime,at:Date.now()};SV('cw',o)});
vid.addEventListener('ended',()=>{const o=LS('cw');delete o[curId];SV('cw',o)});
function dl(){if(!vid.src)return;const o=LS('ml');o[curId]={title:curT,url:vid.src,at:Date.now()};SV('ml',o);dlb.textContent='✓ Saved to My Loads';const a=document.createElement('a');a.href=vid.src;a.download='';a.target='_blank';a.click()}
function lv(i){hd.textContent="DOOR "+(i+1)+" · "+D[i][0].toUpperCase();lvt.textContent=D[i][0]+" (live)";go('livev')}
function doS(){B='(collection:feature_films OR collection:classic_tv) AND title:('+sq.value.replace(/[^\w ]/g,'')+')';cur=-1;page=1;items.innerHTML='';lt.textContent='Search: '+sq.value;go('list');load()}
const P=[["1920s","year:[1920 TO 1929]"],["1930s","year:[1930 TO 1939]"],["1940s","year:[1940 TO 1949]"],["1950s","year:[1950 TO 1959]"],["1960s","year:[1960 TO 1969]"],["1970s","year:[1970 TO 1979]"],["1980s","year:[1980 TO 1989]"],["Unmarked freight","NOT year:[1920 TO 1989]"]];
const S=u=>fetch("https://archive.org/advancedsearch.php?output=json&"+u).then(r=>r.json());
const q=x=>encodeURIComponent(x?B+" AND "+x:B);let stack=["ext"],cur,page;
function show(v){document.querySelectorAll('.v').forEach(e=>e.classList.toggle('on',e.id==v));document.getElementById('back').style.display=v=='ext'?'none':'block';scrollTo(0,0)}
function go(v){stack.push(v);show(v)}
function back(){if(stack.at(-1)=='det'){vid.pause();vid.removeAttribute('src');vid.load()}stack.pop();const v=stack.at(-1);if(v=='ext'){document.querySelectorAll('.ph.open').forEach(e=>e.classList.remove('open'));hd.textContent='DRYVAN DRIVE-IN'}show(v)}
function pals(){grid.innerHTML=P.map((p,i)=>`<div class="pal" onclick="pick(${i})"><div class="box">${p[0]}</div><small id="c${i}">counting…</small></div>`).join('');
P.forEach((p,i)=>S("q="+q(p[1])+"&rows=0").then(j=>document.getElementById('c'+i).textContent=j.response.numFound.toLocaleString()+" films").catch(()=>document.getElementById('c'+i).textContent="count unavailable"))}
function openT(i){ti=i;B=D[i][1];hd.textContent='DOOR '+(i+1)+' · '+D[i][0].toUpperCase();document.getElementById('w'+i).classList.add('open');pals();setTimeout(()=>go('pals'),1100)}
function pick(i){cur=i;page=1;items.innerHTML='';lt.textContent=P[i][0]+" pallet";go('list');load()}
function load(){more.textContent="Loading…";S("q="+q(cur<0?"":P[cur][1])+"&fl[]=identifier&fl[]=title&fl[]=year&sort[]=downloads+desc&rows=30&page="+page).then(j=>{
 items.insertAdjacentHTML('beforeend',j.response.docs.map(d=>`<div class="item" onclick="det('${d.identifier}')"><img loading="lazy" src="https://archive.org/services/img/${d.identifier}"><div><b>${(d.title+'').replace(/</g,'&lt;')}</b><span>${d.year||'no year'}</span></div></div>`).join(''));
 more.style.display=page*30<j.response.numFound?'block':'none';more.textContent="Load more";page++}).catch(()=>more.textContent="Retry")}
function det(id){go('det');curId=id;dlb.textContent="⬇ Download";dt.textContent="Loading…";dm.textContent=dd.textContent="";vid.removeAttribute('src');
 fetch("https://archive.org/metadata/"+id).then(r=>r.json()).then(m=>{const md=m.metadata||{};dt.textContent=curT=md.title||id;dm.textContent=[md.year||md.date,md.runtime].filter(Boolean).join(" · ");
 const t=document.createElement('div');t.innerHTML=[].concat(md.description||'').join(' ');dd.textContent=t.textContent.slice(0,600);
 const f=(m.files||[]).filter(f=>/\.mp4$/i.test(f.name)).sort((a,b)=>(/512kb|h\.264/i.test(b.name)?1:0)-(/512kb|h\.264/i.test(a.name)?1:0))[0];
 if(f){vid.src=`https://archive.org/download/${id}/${encodeURIComponent(f.name)}`;vid.poster="https://archive.org/services/img/"+id;const c=LS("cw")[id];if(c)vid.addEventListener("loadedmetadata",()=>{vid.currentTime=c.t;dm.textContent+=" · resumed at "+fmt(c.t)},{once:true})}else dd.textContent="No in-app playable MP4 for this title. "+dd.textContent})}
</script></body></html>
